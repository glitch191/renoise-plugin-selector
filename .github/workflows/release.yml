name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate and build the .xrnx package
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/build-xrnx.ps1 -Tag "$env:TAG" -OutDir dist

      - name: Attach the package to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release upload "$env:TAG" @files --clobber --repo "$env:REPO"

      - name: Upload the package as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: renoise-plugin-selector-dev
          path: dist/
          if-no-files-found: error
